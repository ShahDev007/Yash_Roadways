<svg width="84" height="56" viewBox="0 0 84 56" xmlns="http://www.w3.org/2000/svg">
  <!-- Cargo container body -->
  <rect x="28" y="3" width="52" height="28" rx="3" fill="white"/>
  <!-- Horizontal panel lines on cargo body -->
  <line x1="28" y1="14" x2="80" y2="14" stroke="rgba(30,58,123,0.20)" stroke-width="1"/>
  <line x1="28" y1="23" x2="80" y2="23" stroke="rgba(30,58,123,0.20)" stroke-width="1"/>
  <!-- Cab -->
  <path d="M6 18 C6 9 13 3 22 3 L28 3 L28 31 L6 31 Z" fill="white"/>
  <!-- Windshield (tinted glass) -->
  <path d="M10 20 C10 13 15 8 22 8 L26 8 L26 27 L10 27 Z" fill="rgba(30,58,123,0.40)"/>
  <!-- Cab door line -->
  <line x1="16" y1="18" x2="16" y2="31" stroke="rgba(30,58,123,0.20)" stroke-width="1"/>
  <!-- Chassis rail -->
  <rect x="4" y="31" width="76" height="3" rx="1.5" fill="white"/>
  <!-- Front wheel -->
  <circle cx="20" cy="41" r="8" fill="#0a0a1e"/>
  <circle cx="20" cy="41" r="4" fill="#1a1a35"/>
  <circle cx="20" cy="41" r="1.5" fill="rgba(255,255,255,0.35)"/>
  <!-- Rear wheels (tandem axle) -->
  <circle cx="59" cy="41" r="8" fill="#0a0a1e"/>
  <circle cx="59" cy="41" r="4" fill="#1a1a35"/>
  <circle cx="59" cy="41" r="1.5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="72" cy="41" r="8" fill="#0a0a1e"/>
  <circle cx="72" cy="41" r="4" fill="#1a1a35"/>
  <circle cx="72" cy="41" r="1.5" fill="rgba(255,255,255,0.35)"/>
  <!-- Gold speed lines (like on the business card) -->
  <line x1="1" y1="51" x2="36" y2="51" stroke="#C8860A" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="1" y1="56" x2="52" y2="56" stroke="#C8860A" stroke-width="2.4" stroke-linecap="round"/>
</svg>
